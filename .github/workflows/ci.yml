name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: UI script checks
        run: node apps/desktop/ui/check.js
      - run: cargo run --release -p rig-render -- --arrangement "Intro,Chorus,Verse 1,Chorus,Bridge,Outro" --mute "Verse 1=Drums" --channels 10 --out render.wav

  # Publishes a GitHub Release (and the update the app installs itself) whenever
  # the version in tauri.conf.json goes up. Same version = nothing is published.
  # The only Mac job: it runs the app tests on every push and, when the version is
  # new, builds and publishes. One Mac machine per push, from the macos-26 pool
  # (macos-latest was scarce; macos-14 jobs started being cancelled on 2026-11-05, as
  # GitHub retires that image; macos-15 jobs then waited 15 min for a machine and were
  # cancelled, twice).
  release:
    name: Mac app tests and release
    needs: [engine]
    runs-on: macos-26
    permissions:
      contents: write
    env:
      # Build the speech model library (whisper.cpp) for any Apple Silicon Mac, not
      # tuned to the build machine's CPU: on macos-15 the tuning breaks the compile,
      # and a build tuned to a newer chip could crash on an older Mac.
      WHISPER_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - name: Is this version already released?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: App tests
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Build, sign and publish
        if: steps.ver.outputs.new == 'true' && github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --target universal-apple-darwin
          tagName: v__VERSION__
          releaseName: Playback Rig __VERSION__
          releaseBody: Download the .dmg below to install. If you already have Playback Rig 0.2 or later, it updates itself; look for "Install & restart" at the bottom of the window.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
