[package]
name = "playback-rig"
version = "0.8.0"
edition = "2021"
license = "UNLICENSED"
description = "Playback Rig desktop app"

[[bin]]
name = "playback-rig"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rig-engine = { path = "../../../crates/engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
midir = "0.10"
rtrb = "0.3"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "wav", "pcm", "flac", "alac", "aiff"] }
rubato = "0.16"
whisper-rs = "0.15"
ureq = "2"
base64 = "0.22"
flate2 = "1"
hound = "3.5"
regex = "1"
signalsmith-stretch = "0.1.3"

[profile.release]
opt-level = 3
